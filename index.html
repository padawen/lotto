<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottó Szelvény Ellenőrző</title>
    <meta name="description" content="Egyszerű és elegáns lottószelvény ellenőrző alkalmazás.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png?v=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=1">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Lottó Ellenőrző</h1>
            <p class="subtitle">Add meg a nyerőszámokat az ellenőrzéshez</p>
        </header>

        <section class="lotto-type-section">
            <div class="toggle-group">
                <button id="lotto-5-btn" class="toggle-btn active" data-type="5">Ötöslottó</button>
                <button id="lotto-6-btn" class="toggle-btn" data-type="6">Hatoslottó</button>
            </div>
        </section>

        <section class="winning-numbers-section">
            <div id="input-container" class="input-group">
                <input type="number" class="winning-input" min="1" max="99" placeholder="1" inputmode="numeric">
                <input type="number" class="winning-input" min="1" max="99" placeholder="2" inputmode="numeric">
                <input type="number" class="winning-input" min="1" max="99" placeholder="3" inputmode="numeric">
                <input type="number" class="winning-input" min="1" max="99" placeholder="4" inputmode="numeric">
                <input type="number" class="winning-input" min="1" max="99" placeholder="5" inputmode="numeric">
            </div>
            <button id="clear-btn">Törlés</button>
        </section>

        <main id="tickets-list">
            <!-- Tickets will be rendered here -->
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
